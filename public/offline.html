<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#070708" />
    <title>YESOD HUB — sem conexão</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 10%,rgba(232,111,34,.16),transparent 34rem),#070708;color:#f5f5f6;font-family:Arial,sans-serif}.card{width:min(100%,520px);padding:38px;border:1px solid #323238;border-radius:20px;background:#111214;box-shadow:0 0 36px rgba(232,111,34,.12)}.brand{color:#e86f22;font-size:12px;font-weight:700;letter-spacing:.24em}.line{width:54px;height:2px;margin:18px 0;background:#e86f22}h1{margin:0 0 14px;font-size:clamp(28px,7vw,42px)}p{margin:0;color:#aaaab0;line-height:1.7}.button{display:inline-flex;margin-top:26px;padding:12px 18px;border-radius:10px;background:#e86f22;color:#fff;text-decoration:none;font-weight:700}
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">YESOD HUB</div><div class="line"></div>
      <h1>Você está sem conexão.</h1>
      <p>Assim que a internet voltar, o YESOD HUB poderá carregar conteúdos, sua área de membros e o Marley normalmente.</p>
      <a class="button" href="/">Tentar novamente</a>
    </main>
  </body>
</html>
